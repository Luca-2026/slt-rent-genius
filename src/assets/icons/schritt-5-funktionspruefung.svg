<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Anhänger-Heck (vereinfacht) -->
  <rect x="10" y="28" width="100" height="44" rx="7" fill="#EAF3DE" stroke="#97C459" stroke-width="1.5"/>
  <!-- Deichsel oben andeutungsweise -->
  <!-- Räder -->
  <circle cx="32" cy="78" r="12" fill="#D3D1C7" stroke="#888780" stroke-width="1.5"/>
  <circle cx="32" cy="78" r="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <circle cx="88" cy="78" r="12" fill="#D3D1C7" stroke="#888780" stroke-width="1.5"/>
  <circle cx="88" cy="78" r="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <!-- Blinker links (gelb leuchtend) -->
  <rect x="11" y="31" width="14" height="10" rx="2.5" fill="#EF9F27" stroke="#BA7517" stroke-width="1"/>
  <rect x="11" y="31" width="14" height="10" rx="2.5" fill="#FAC775" opacity=".6"/>
  <!-- Bremslicht rechts oben (rot) -->
  <rect x="95" y="31" width="14" height="10" rx="2.5" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
  <!-- Rücklicht rechts unten (rot) -->
  <rect x="95" y="45" width="14" height="10" rx="2.5" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
  <!-- Rücklicht links unten (rot) -->
  <rect x="11" y="45" width="14" height="10" rx="2.5" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
  <!-- Kennzeichenfeld -->
  <rect x="46" y="56" width="28" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="10" fill="#27500A" text-anchor="middle" x="60" y="108">Blinker · Rücklicht · Bremse</text>
</svg>
