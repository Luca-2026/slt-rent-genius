<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Dose (Fahrzeug, links) -->
  <circle cx="35" cy="60" r="26" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <circle cx="35" cy="60" r="17" fill="#B5D4F4" stroke="#85B7EB" stroke-width="1"/>
  <!-- Kerbe Dose oben -->
  <rect x="30" y="30" width="10" height="9" rx="4" fill="#185FA5"/>
  <!-- Stecker (rechts, noch nicht eingesteckt) -->
  <circle cx="88" cy="60" r="24" fill="#D3D1C7" stroke="#888780" stroke-width="2"/>
  <circle cx="88" cy="60" r="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <!-- Kerbe Stecker oben -->
  <rect x="83" y="32" width="10" height="9" rx="4" fill="#888780"/>
  <!-- Hilfslinie zeigt: Kerben fluchten -->
  <line x1="35" y1="33" x2="88" y2="33" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Richtungs-Pfeil -->
  <path d="M70 60 L54 60" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Label -->
  <text font-family="Arial, sans-serif" font-size="10" fill="#0C447C" text-anchor="middle" x="60" y="110">Kerben ausrichten</text>
</svg>
