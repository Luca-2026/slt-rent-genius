<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arbeitsbühne mieten: welcher Typ und welche Arbeitshöhe – Blog-Vorschau</title>
<desc>Vorschaubild zeigt schematisch eine Scherenbühne und eine Gelenkteleskopbühne nebeneinander, mit einer Höhenlinie und der Beschriftung „Arbeitshöhe = Plattformhöhe + 2 m".</desc>

<rect width="680" height="360" fill="#eff6ff"/>
<circle cx="630" cy="40" r="140" fill="#dbeafe"/>
<circle cx="50" cy="340" r="80" fill="#dbeafe"/>

<rect x="40" y="48" width="40" height="3" fill="#00507d"/>
<text x="40" y="75" font-family="sans-serif" font-size="12" font-weight="500" fill="#00507d" letter-spacing="2">SLT RENTAL · RATGEBER</text>

<text x="40" y="138" font-family="sans-serif" font-size="30" font-weight="600" fill="#0f172a">Arbeitsbühne mieten</text>
<text x="40" y="174" font-family="sans-serif" font-size="26" font-weight="500" fill="#0f172a">Welcher Typ, welche Höhe?</text>
<text x="40" y="208" font-family="sans-serif" font-size="14" font-weight="400" fill="#475569">Arbeitshöhe = Plattformhöhe + 2 m</text>

<!-- Höhenlinie -->
<g stroke="#00507d" stroke-width="1.5" fill="none">
  <line x1="380" y1="90" x2="380" y2="280"/>
  <polyline points="375,95 380,85 385,95"/>
  <polyline points="375,275 380,285 385,275"/>
</g>
<text x="392" y="190" font-family="sans-serif" font-size="11" fill="#00507d" font-weight="500">Höhe</text>

<!-- Scherenbühne -->
<g transform="translate(420, 110)">
  <rect x="0" y="0" width="80" height="14" rx="2" fill="#00507d"/>
  <rect x="6" y="-6" width="68" height="6" fill="#00507d"/>
  <g stroke="#00507d" stroke-width="3" fill="none">
    <line x1="20" y1="14" x2="60" y2="60"/>
    <line x1="60" y1="14" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="60" y2="106"/>
    <line x1="60" y1="60" x2="20" y2="106"/>
    <line x1="20" y1="106" x2="60" y2="152"/>
    <line x1="60" y1="106" x2="20" y2="152"/>
  </g>
  <rect x="4" y="152" width="72" height="18" rx="3" fill="#0f172a"/>
  <circle cx="18" cy="178" r="7" fill="#0f172a"/>
  <circle cx="62" cy="178" r="7" fill="#0f172a"/>
  <text x="40" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Scheren­bühne</text>
</g>

<!-- Gelenkteleskopbühne -->
<g transform="translate(540, 90)">
  <rect x="0" y="0" width="60" height="14" rx="2" fill="#ff8e02"/>
  <rect x="6" y="-6" width="48" height="6" fill="#ff8e02"/>
  <g stroke="#ff8e02" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="30" y1="14" x2="30" y2="60"/>
    <line x1="30" y1="60" x2="100" y2="40"/>
    <line x1="100" y1="40" x2="100" y2="20"/>
  </g>
  <rect x="80" y="0" width="36" height="20" rx="2" fill="#0f172a"/>
  <rect x="10" y="172" width="60" height="18" rx="3" fill="#0f172a"/>
  <circle cx="22" cy="198" r="7" fill="#0f172a"/>
  <circle cx="58" cy="198" r="7" fill="#0f172a"/>
  <line x1="30" y1="14" x2="30" y2="172" stroke="#ff8e02" stroke-width="4"/>
  <text x="40" y="220" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Gelenk­teleskop</text>
</g>

<rect x="0" y="305" width="680" height="55" fill="#cbd5e1"/>
<line x1="0" y1="305" x2="680" y2="305" stroke="#94a3b8" stroke-width="1"/>
<text x="40" y="340" font-family="sans-serif" font-size="14" font-weight="500" fill="#0f172a">slt-rental.de/ratgeber</text>
</svg>
