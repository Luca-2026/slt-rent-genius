<svg width="100%" viewBox="0 0 2400 1500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Partyzelt mieten: Größe, Genehmigung und Checkliste – Blog-Vorschau</title>
<desc>Illustration: Weißes Partyzelt mit Bierzeltgarnituren und Gästen - Ratgeber von SLT Rental</desc>

<rect width="2400" height="1500" fill="#eff6ff"/>
<circle cx="2230" cy="150" r="500" fill="#dbeafe"/>
<circle cx="180" cy="1190" r="290" fill="#dbeafe"/>
<ellipse cx="1500" cy="1080" rx="620" ry="230" fill="#e0edfd"/>

<rect x="150" y="180" width="150" height="12" fill="#ff8e02"/>
<text x="150" y="270" font-family="sans-serif" font-size="42" font-weight="500" fill="#00507d" letter-spacing="8">SLT RENTAL · RATGEBER</text>

<text x="150" y="470" font-family="sans-serif" font-size="108" font-weight="700" fill="#0f172a">Partyzelt mieten</text>
<text x="150" y="600" font-family="sans-serif" font-size="90" font-weight="600" fill="#0f172a">Größe, Genehmigung und Checkliste</text>
<text x="150" y="690" font-family="sans-serif" font-size="48" font-weight="400" fill="#64748b">Die richtige Zeltgröße für Deine Feier</text>

<!-- Partyzelt mit Bierzeltgarnitur -->
<g transform="translate(150, 830)">
  <!-- Zeltdach -->
  <path d="M60 210 L510 20 L960 210 Z" fill="#ffffff" stroke="#00507d" stroke-width="10" stroke-linejoin="round"/>
  <path d="M510 20 L510 -18" stroke="#00507d" stroke-width="10" stroke-linecap="round"/>
  <circle cx="510" cy="-30" r="14" fill="#ff8e02"/>
  <!-- First-Fahne -->
  <path d="M524 -44 L600 -30 L524 -14 Z" fill="#ff8e02"/>
  <!-- Seitenwand links -->
  <rect x="60" y="210" width="26" height="200" fill="#e2e8f0" stroke="#00507d" stroke-width="8"/>
  <!-- Seitenwand rechts -->
  <rect x="934" y="210" width="26" height="200" fill="#e2e8f0" stroke="#00507d" stroke-width="8"/>
  <!-- Mittelpfosten -->
  <rect x="502" y="210" width="16" height="200" fill="#00507d"/>
  <!-- Boden -->
  <rect x="20" y="410" width="980" height="26" rx="13" fill="#00507d"/>

  <!-- Bierzeltgarnitur -->
  <g transform="translate(230, 270)">
    <rect x="0" y="0" width="360" height="20" rx="8" fill="#ff8e02"/>
    <rect x="20" y="20" width="14" height="90" fill="#b45309"/>
    <rect x="326" y="20" width="14" height="90" fill="#b45309"/>
    <rect x="-30" y="56" width="420" height="14" rx="7" fill="#fbbf24"/>
    <rect x="-18" y="70" width="12" height="42" fill="#b45309"/>
    <rect x="366" y="70" width="12" height="42" fill="#b45309"/>
  </g>

  <!-- Gast 1 -->
  <g transform="translate(700, 250)">
    <circle cx="0" cy="0" r="26" fill="#0f172a"/>
    <rect x="-22" y="26" width="44" height="80" rx="18" fill="#00507d"/>
    <rect x="-16" y="106" width="12" height="52" fill="#0f172a"/>
    <rect x="4" y="106" width="12" height="52" fill="#0f172a"/>
  </g>
  <!-- Gast 2 -->
  <g transform="translate(790, 262)">
    <circle cx="0" cy="0" r="24" fill="#0f172a"/>
    <rect x="-20" y="24" width="40" height="72" rx="16" fill="#ff8e02"/>
    <rect x="-14" y="96" width="11" height="50" fill="#0f172a"/>
    <rect x="3" y="96" width="11" height="50" fill="#0f172a"/>
  </g>
</g>

<!-- Maßstab-Grafik rechts -->
<g transform="translate(1450, 830)">
  <rect x="0" y="0" width="800" height="440" rx="36" fill="#ffffff" stroke="#00507d" stroke-width="8"/>
  <text x="60" y="100" font-family="sans-serif" font-size="52" font-weight="700" fill="#0f172a">Faustformel</text>
  <rect x="60" y="140" width="90" height="10" fill="#ff8e02"/>
  <text x="60" y="220" font-family="sans-serif" font-size="44" font-weight="600" fill="#00507d">0,5 m²</text>
  <text x="280" y="220" font-family="sans-serif" font-size="40" font-weight="400" fill="#334155">pro stehendem Gast</text>
  <text x="60" y="300" font-family="sans-serif" font-size="44" font-weight="600" fill="#00507d">0,8 m²</text>
  <text x="280" y="300" font-family="sans-serif" font-size="40" font-weight="400" fill="#334155">pro Sitzplatz</text>
  <text x="60" y="380" font-family="sans-serif" font-size="44" font-weight="600" fill="#00507d">75 m²</text>
  <text x="280" y="380" font-family="sans-serif" font-size="40" font-weight="400" fill="#334155">genehmigungsfrei</text>
</g>
</svg>
