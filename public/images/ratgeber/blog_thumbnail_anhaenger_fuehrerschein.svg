<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anhänger-Führerschein: B, B96 oder BE – Blog-Vorschau</title>
<desc>Vorschaubild zeigt drei Gewichtsbalken für 3.500 kg (B), 4.250 kg (B96) und 7.000 kg (BE) neben einem stilisierten Pkw mit Anhänger.</desc>

<rect width="680" height="360" fill="#eff6ff"/>
<circle cx="630" cy="40" r="140" fill="#dbeafe"/>
<circle cx="50" cy="340" r="80" fill="#dbeafe"/>

<rect x="40" y="48" width="40" height="3" fill="#00507d"/>
<text x="40" y="75" font-family="sans-serif" font-size="12" font-weight="500" fill="#00507d" letter-spacing="2">SLT RENTAL · RATGEBER</text>

<text x="40" y="138" font-family="sans-serif" font-size="30" font-weight="600" fill="#0f172a">Anhänger-Führerschein</text>
<text x="40" y="174" font-family="sans-serif" font-size="30" font-weight="500" fill="#0f172a">B, B96 oder BE?</text>
<text x="40" y="212" font-family="sans-serif" font-size="16" font-weight="400" fill="#475569">In zwei Minuten zur richtigen Klasse.</text>

<!-- Drei Gewichtsbalken -->
<g transform="translate(40, 240)" font-family="sans-serif">
  <rect x="0" y="0" width="160" height="22" rx="4" fill="#bfdbfe"/>
  <rect x="0" y="0" width="80" height="22" rx="4" fill="#00507d"/>
  <text x="170" y="16" font-size="13" font-weight="600" fill="#0f172a">B · bis 3.500 kg</text>

  <rect x="0" y="30" width="160" height="22" rx="4" fill="#bfdbfe"/>
  <rect x="0" y="30" width="97" height="22" rx="4" fill="#00507d"/>
  <text x="170" y="46" font-size="13" font-weight="600" fill="#0f172a">B96 · bis 4.250 kg</text>

  <rect x="0" y="60" width="160" height="22" rx="4" fill="#bfdbfe"/>
  <rect x="0" y="60" width="160" height="22" rx="4" fill="#ff8e02"/>
  <text x="170" y="76" font-size="13" font-weight="600" fill="#0f172a">BE · bis 7.000 kg</text>
</g>

<!-- Pkw + Anhänger Icon -->
<g transform="translate(470, 250)" fill="#00507d">
  <rect x="0" y="20" width="70" height="22" rx="4"/>
  <rect x="6" y="8" width="55" height="16" rx="3"/>
  <circle cx="14" cy="48" r="7" fill="#0f172a"/>
  <circle cx="56" cy="48" r="7" fill="#0f172a"/>
  <rect x="78" y="18" width="6" height="6"/>
  <rect x="90" y="14" width="80" height="28" rx="3"/>
  <circle cx="104" cy="48" r="7" fill="#0f172a"/>
  <circle cx="156" cy="48" r="7" fill="#0f172a"/>
</g>

<rect x="0" y="305" width="680" height="55" fill="#cbd5e1"/>
<line x1="0" y1="305" x2="680" y2="305" stroke="#94a3b8" stroke-width="1"/>
<text x="40" y="340" font-family="sans-serif" font-size="14" font-weight="500" fill="#0f172a">slt-rental.de/ratgeber</text>
</svg>
